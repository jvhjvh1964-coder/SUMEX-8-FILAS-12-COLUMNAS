h1 {

    display: grid;

    aspect-ratio: 12 / 8;

.celda {

    min-height: 0;
    border-radius: 7px;
    border: 2px solid rgba(255,255,255,0.35);

    transition: transform 0.12s, filter 0.12s;

}

.celda:hover:not(.oculta) {
    filter: brightness(1.3);
    transform: scale(1.05);
    z-index: 2;
}

.celda.seleccionada {
    outline: 4px solid white;
    outline-offset: -4px;
    transform: scale(0.91);
    filter: brightness(1.35);
}

.celda.oculta {
    visibility: hidden;
    pointer-events: none;
}

.amarillo {

}

.rojo {

}

.azul {

.celeste {

}

#emojiInicio {

}

@keyframes zoomInicio {
    0% {
        transform: scale(0.01) rotate(-30deg);
        opacity: 0;
    }
    40% {
        opacity: 1;
    }
    100% {
        transform: scale(1) rotate(0deg);
        opacity: 1;
    }

#feedback {

}

#feedback.incorrecto {
    color: #ff1717;
    text-shadow: 0 0 35px #ff0000;
}

@keyframes zoomFeedback {
    0% {
        transform: scale(0.05);
        opacity: 0;
    }
    60% {
        transform: scale(1.25);
        opacity: 1;
    }
    100% {
        transform: scale(1);

    }

/* =====================================
   EXPLOSIÓN DE BURBUJAS MULTICOLORES
===================================== */

#burbujas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;

    overflow: hidden;
    pointer-events: none;

    z-index: 850;
}

/* BURBUJAS */

.burbuja {
    position: absolute;

    left: 50%;
    top: 50%;

    width: var(--tamano);
    height: var(--tamano);

    border-radius: 50%;

    background: var(--color);

    border: 3px solid rgba(255,255,255,0.85);

    box-shadow:
        inset -8px -10px 18px rgba(0,0,0,0.15),
        inset 7px 7px 15px rgba(255,255,255,0.55),
        0 0 18px var(--color);

    opacity: 0;

    transform: translate(-50%, -50%) scale(0.05);

    animation: explosionBurbujas 2s ease-out forwards;
}

/* EXPANSIÓN DESDE EL CENTRO */

@keyframes explosionBurbujas {

    0% {
        transform:
            translate(-50%, -50%)
            scale(0.05);

        opacity: 0;
    }

    12% {
        opacity: 0.95;
    }

    65% {
        opacity: 0.85;
    }

    100% {
        transform:
            translate(
                calc(-50% + var(--dx)),
                calc(-50% + var(--dy))
            )
            scale(1);

        opacity: 0;
    }

}

    let sumando1 = numeroAleatorio(0, 9);
    let sumando2 = numeroAleatorio(0, 9);

    // CALCULAR RESULTADO

        sumando2,

    ]);

function dibujarTablero() {

    const contenedor = document.getElementById("tablero");

        });

    });

}

    const horizontal =
        minFila === maxFila &&
        maxCol - minCol === 2 &&
        new Set(columnas).size === 3;

    // OPCIÓN B: 3 celdas verticales consecutivas

    const vertical =
        minCol === maxCol &&
        maxFila - minFila === 2 &&
        new Set(filas).size === 3;

    // OPCIÓN C: 3 celdas formando una L
    // dentro de un cuadrado de 2 x 2.

    const formaL =
        maxFila - minFila === 1 &&
        maxCol - minCol === 1 &&
        new Set(posiciones.map(p =>
            p.fila + "-" + p.columna
        )).size === 3;

    return horizontal || vertical || formaL;

}


// ========================================
// 7. COMPROBAR OPERACIÓN MATEMÁTICA
// ========================================

function operacionValida(indices) {

    const numeros = indices.map(
        i => tablero[i].numero
    );

    // CUALQUIERA DE LOS 3 NÚMEROS
    // PUEDE SER EL RESULTADO.

    for (let i = 0; i < 3; i++) {

        const resultado = numeros[i];

        const sumandos = numeros.filter(
            (_, posicion) => posicion !== i
        );

        // COMPROBAR ADICIÓN

        if (
            sumandos[0] + sumandos[1] === resultado
        ) {

            return true;

        }

    }

    return false;

}


// ========================================
// 8. COMPROBAR RESPUESTA
// ========================================

function comprobarSeleccion() {

    if (juegoTerminado) return;

    const formaCorrecta = formaValida(seleccion);

    const operacionCorrecta = operacionValida(seleccion);

    if (formaCorrecta && operacionCorrecta) {

	// RESPUESTA CORRECTA
	correctas++;
	actualizarContadores();

	// Mostrar ✔️ azul con zoom.
	mostrarFeedback(true);

	// Activar explosión de burbujas multicolores.
	mostrarBurbujas();


        // Ocultar las tres celdas.

        seleccion.forEach(indice => {

            tablero[indice].visible = false;

        });

        dibujarTablero();

        seleccion = [];

        setTimeout(() => {

            if (juegoTerminado) return;

            // Comprobar si no quedan celdas.

            const restantes = tablero.filter(
                celda => celda.visible
            ).length;

            if (restantes === 0) {
                terminarJuego();
            } else {
                bloqueado = false;
            }

        }, 300);

    } else {

        // RESPUESTA INCORRECTA

        incorrectas++;

        actualizarContadores();

        mostrarFeedback(false);

        // Quitar selección visual.

        document.querySelectorAll(".seleccionada")
            .forEach(elemento => {
                elemento.classList.remove("seleccionada");
            });

        seleccion = [];

        setTimeout(() => {

            if (!juegoTerminado) {
                bloqueado = false;
            }

        }, 300);

    }

}


// ========================================
// 9. EFECTOS EMERGENTES
// ========================================

function mostrarFeedback(esCorrecto) {

    const feedback = document.getElementById("feedback");

    feedback.className = "";

    feedback.textContent = esCorrecto ? "✔️" : "❌";

    feedback.classList.add(
        "mostrar",
        esCorrecto ? "correcto" : "incorrecto"
    );

    // El efecto dura 0.3 segundos.

    setTimeout(() => {

        feedback.className = "";
        feedback.textContent = "";

    }, 300);

}


// ========================================
// EXPLOSIÓN DE BURBUJAS POR 2 SEGUNDOS
// ========================================

function mostrarBurbujas() {

    const contenedor = document.getElementById("burbujas");

    // Crear una nueva capa para cada explosión.

    const capa = document.createElement("div");

    capa.style.position = "absolute";
    capa.style.inset = "0";
    capa.style.overflow = "hidden";

    contenedor.appendChild(capa);

    // Colores de las burbujas.

    const coloresBurbujas = [
        "#ff0000",
        "#0066ff",
        "#ffdf00"
    ];

    // Cantidad de burbujas.

    const CANTIDAD = 42;

    // Distancia máxima desde el centro.

    const distanciaMaxima = Math.hypot(
        window.innerWidth / 2,
        window.innerHeight / 2
    );

    for (let i = 0; i < CANTIDAD; i++) {

        const burbuja = document.createElement("div");

        burbuja.className = "burbuja";

        // Dirección aleatoria desde el centro.

        const angulo = Math.random() * Math.PI * 2;

        const distancia =
            distanciaMaxima * (0.45 + Math.random() * 0.65);

        const dx = Math.cos(angulo) * distancia;
        const dy = Math.sin(angulo) * distancia;

        // Tamaños grandes y extra grandes.

        let tamano;

        if (Math.random() < 0.45) {

            // EXTRA GRANDES: 160 a 230 px.

            tamano = 160 + Math.random() * 70;

        } else {

            // GRANDES: 65 a 150 px.

            tamano = 65 + Math.random() * 85;

        }

        // Color aleatorio.

        const color = coloresBurbujas[
            Math.floor(Math.random() * coloresBurbujas.length)
        ];

        // Aplicar propiedades.

        burbuja.style.setProperty("--tamano", tamano + "px");

        burbuja.style.setProperty("--color", color);

        burbuja.style.setProperty("--dx", dx + "px");

        burbuja.style.setProperty("--dy", dy + "px");

        capa.appendChild(burbuja);

    }

    // Eliminar las burbujas después de 2 segundos.

    setTimeout(() => {

        capa.remove();

    }, 2000);

}

// ========================================
// CONSULTAR Y ACTUALIZAR GOOGLE SHEETS
// ========================================

function cargarRanking(datosNuevo = null) {

    const estado = document.getElementById("estadoRanking");

    estado.textContent = "CARGANDO RANKING...";

    // Determinar si hay que registrar al estudiante.

    const registrar =
        datosNuevo && datosNuevo.nota === "7.0";

    const parametros = new URLSearchParams({

        action: registrar ? "add" : "list",

        callback: "procesarRespuestaRanking"

    });

    // Enviar los datos solamente si obtuvo nota 7.0.

    if (registrar) {

        parametros.set("nota", datosNuevo.nota);
        parametros.set("fecha", datosNuevo.fecha);
        parametros.set("hora", datosNuevo.hora);
        parametros.set("nombre", datosNuevo.nombre);
        parametros.set("puntaje", datosNuevo.puntaje);

    }

    // Crear solicitud JSONP.

    const script = document.createElement("script");

    script.src = URL_RANKING + "?" + parametros.toString();

    script.id = "solicitudRanking";

    script.onerror = function() {

        estado.textContent =
            "NO SE PUDO CARGAR EL RANKING. REVISA LA CONEXIÓN.";

        script.remove();

    };

    document.head.appendChild(script);

}


// ========================================
// RECIBIR LOS DATOS DE GOOGLE SHEETS
// ========================================

window.procesarRespuestaRanking = function(datos) {

    const cuerpo = document.getElementById("cuerpoRanking");

    const estado = document.getElementById("estadoRanking");

    cuerpo.innerHTML = "";

    const registros = datos.ranking || [];

    if (registros.length === 0) {

        const fila = document.createElement("tr");

        const celda = document.createElement("td");

        celda.colSpan = 4;

        celda.textContent =
            "TODAVÍA NO HAY ESTUDIANTES CON NOTA 7.0";

        fila.appendChild(celda);

        cuerpo.appendChild(fila);

        estado.textContent = "RANKING MULTIPLEX";

        return;

    }

    // Mostrar los estudiantes ordenados por puntaje.

    registros.forEach(registro => {

        const fila = document.createElement("tr");

        const valores = [
            registro.puntaje,
            registro.fecha,
            registro.hora,
            registro.nombre
        ];

        valores.forEach(valor => {

            const celda = document.createElement("td");

            celda.textContent = valor;

            fila.appendChild(celda);

        });

        cuerpo.appendChild(fila);

    });

    estado.textContent =
        "TOTAL DE ESTUDIANTES CLASIFICADOS: " + registros.length;

};



// ========================================
// 10. ACTUALIZAR CONTADORES
// ========================================

function actualizarContadores() {

    document.getElementById("correctas").textContent = correctas;

    document.getElementById("incorrectas").textContent = incorrectas;

}


// ========================================
// 11. TEMPORIZADOR REGRESIVO
// ========================================

function iniciarTemporizador() {

    intervalo = setInterval(() => {

        tiempo--;

        document.getElementById("tiempo").textContent = tiempo;

        if (tiempo <= 0) {

            tiempo = 0;

            document.getElementById("tiempo").textContent = 0;

            terminarJuego();

        }

    }, 1000);

}


// ========================================
// 12. CALCULAR NOTA FINAL
// ========================================

// CALCULAR RESPUESTAS SIN RESPONDER

function calcularSinResponder() {

    const TOTAL_PREGUNTAS = 32;

    return Math.max(
        0,
        TOTAL_PREGUNTAS - correctas - incorrectas
    );

}


// CALCULAR NOTA FINAL

function calcularNota() {

    const sinResponder = calcularSinResponder();

    const descuentos =
        (incorrectas + sinResponder) * 0.3;

    const nota = Math.max(
        1.0,
        7.0 - descuentos
    );

    return nota.toFixed(1);

}


// ========================================
// 13. TERMINAR Y BLOQUEAR EL JUEGO
// ========================================

function terminarJuego() {

    if (juegoTerminado) return;

    juegoTerminado = true;

    bloqueado = true;

    clearInterval(intervalo);

    // BLOQUEAR TODAS LAS CELDAS

    document.querySelectorAll(".celda").forEach(elemento => {
        elemento.style.pointerEvents = "none";
    });

    // CALCULAR RESULTADOS

    const sinResponder = calcularSinResponder();

    const nota = calcularNota();

	// PUNTAJE: SEGUNDOS RESTANTES

	const puntaje = tiempo;

    // FECHA Y HORA ACTUAL DE CHILE

    const ahora = new Date();

    const fecha = ahora.toLocaleDateString("es-CL");

    const hora = ahora.toLocaleTimeString("es-CL");

    // MOSTRAR NOMBRE DEL ESTUDIANTE
    document.getElementById("nombreFinal").textContent =
    "ESTUDIANTE: " + nombreEstudiante;

    // MOSTRAR NOTA FINAL
    document.getElementById("notaFinal").textContent =
    "NOTA: " + nota;

    // MOSTRAR RESPUESTAS CORRECTAS
    document.getElementById("correctasFinal").textContent =
        "✔ CORRECTAS: " + correctas;

    // MOSTRAR RESPUESTAS ERRADAS
    document.getElementById("incorrectasFinal").textContent =
        "✖ ERRADAS: " + incorrectas;

    // MOSTRAR RESPUESTAS SIN RESPONDER
    document.getElementById("sinResponderFinal").textContent =
        "🤔 SIN RESPONDER: " + sinResponder;

    // FECHA Y HORA EN UNA SOLA FILA, SIN LEYENDAS

    document.getElementById("fechaHoraFinal").textContent =
        fecha + "  |  " + hora;

    // MOSTRAR VENTANA FINAL PERMANENTE

/*    document.getElementById("final").style.display = "flex"; */

    // MOSTRAR PRIMERO LA VENTANA DE NOTA FINAL

     document.getElementById("final").style.display = "flex";


	// ========================================
	// DESPUÉS DE 4 SEGUNDOS, MOSTRAR RANKING
	// ========================================

	setTimeout(() => {

	    // Ocultar ventana de nota final.

	    document.getElementById("final").style.display = "none";

	    // Mostrar ventana permanente del ranking.

	    document.getElementById("ventanaRanking")
	        .style.display = "flex";

	    // Registrar si obtuvo 7.0 y consultar ranking.

	    cargarRanking({

	        nota: nota,

	        fecha: fecha,

	        hora: hora,

	        nombre: nombreEstudiante,

	        puntaje: puntaje

	    });

	}, 4000);

}


// ========================================
// 14. INICIAR JUEGO
// ========================================

function iniciarJuego() {

    generarTablero();

    dibujarTablero();

    actualizarContadores();

    // Esperar a que termine el efecto de la cara 😍.

    const inicio = document.getElementById("inicio");

    inicio.addEventListener("animationend", () => {

        // Ocultar la cara de inicio.

        inicio.style.display = "none";

        // Mostrar ventana para ingresar nombre.

        document.getElementById("ventanaNombre")
            .style.display = "flex";

        // Activar el cursor en el campo de nombre.

        document.getElementById("inputNombre").focus();

    }, { once: true });


    // Convertir automáticamente el nombre a mayúsculas.

    document.getElementById("inputNombre")
        .addEventListener("input", function() {

            this.value = this.value.toUpperCase();

        });


    // Procesar el botón COMENZAR o la tecla ENTER.

    document.getElementById("formNombre")
        .addEventListener("submit", function(event) {

            event.preventDefault();

            confirmarNombre();

        });

}

// ========================================
// CONFIRMAR NOMBRE DEL ESTUDIANTE
// ========================================

function confirmarNombre() {

    const campo = document.getElementById("inputNombre");

    // Guardar nombre en mayúsculas.

    nombreEstudiante = campo.value.trim().toUpperCase();

    // Evitar continuar si está vacío.

    if (nombreEstudiante === "") {

        campo.focus();

        return;

    }

    // Ocultar ventana de ingreso.

    document.getElementById("ventanaNombre")
        .style.display = "none";

    // Habilitar el tablero.

    bloqueado = false;

    // Comenzar los 120 segundos.

    iniciarTemporizador();

}


// ========================================
// 15. EJECUCIÓN
// ========================================

iniciarJuego();

</script>
